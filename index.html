<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <!-- Bootstrap  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<div class="container">
	<h1>My Interactive Dashboard</h1>	
	<p>This dashboard was created by Michael Maggio for the WEB-115 course at Wake Tech</p>
    <script>
        document.write("This dashboard demonstrates how JavaScript can be used to create interactive websites.")
    </script>
    <!-- The <noscript> is for web browsers with JavaScript rendering disabled. -->
    <noscript>Unfortunately, your web browser does not support JavaScript.</noscript>
	</div>
    <div class="container">
        <div class="row">
            <!-- Dashboard Content -->
			<div class="col" id="weekly-tasks">
				<form class="col-4">
					<div class="form-field">
						<label for="name">
							Name: 
						</label>
						<input type="text" name="name" id="name"></input>
					</div>
					<div class="form-field">
						<label for="daily-goal">
							Daily task goal:
						</label>
						<input type="number" name="daily-goal" id="daily-goal"></input>
					</div>
					<div class="form-field">
						<label for="weekly-bonus">
							Weekly bonus tasks: 
						</label>
						<input type="number" name="weekly-bonus" id="weekly-bonus"></input>
					</div>
					<br>
					<span>
						<button id="goal-btn">
							Submit
						</button>
					</span>
				</form>
				<p id="goal-message">
				</p>
				<script src="js/task-manager.js"></script>
			</div>
        </div>
    </div>
</body>
</html>
