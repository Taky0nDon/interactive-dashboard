<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <!-- Bootstrap  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<div class="container">
	<h1>My Interactive Dashboard</h1>	
	<p>This dashboard was created by Michael Maggio for the WEB-115 course at Wake Tech</p>
    <script>
        document.write("This dashboard demonstrates how JavaScript can be used to create interactive websites.")
    </script>
    <!-- The <noscript> is for web browsers with JavaScript rendering disabled. -->
    <noscript>Unfortunately, your web browser does not support JavaScript.</noscript>
	</div>
    <div class="container">
        <div class="row">
            <!-- Dashboard Content -->
			<div class="col" id="weekly-tasks">
				<h2>Weekly Task Calculator</h2>
				<form class="task-form"> 
					<div class="form-field">
						<label for="name">
							Name: 
						</label>
						<input type="text" name="name" id="name" class="task-input"></input>
					</div>
					<div class="form-field">
						<label for="daily-goal">
							Daily task goal:
						</label>
						<input type="number" name="daily-goal" id="daily-goal" class="task-input"></input>
					</div>
					<div class="form-field">
						<label for="weekly-bonus">
							Weekly bonus tasks: 
						</label>
						<input type="number" name="weekly-bonus" id="weekly-bonus" class="task-input"></input>
					</div>
					<br>
					<span>
						<button id="goal-btn">
							Submit
						</button>
					</span>
				</form>
				<p id="goal-message">
				</p>
			</div>
			<div class="col" id="metric-converter">
				<h2>Metric/Imperial Converter</h2>
				<form id="metric-converter">
					<label for="initial_value">Convert</label>
					<input type="number" id="initial_value" name="initial_value"></input>
					<select id="initial_unit">
						<option value="in">in</option>
						<option value="ft">ft</option>
						<option value="yd">yd</option>
						<option value="mi">mi</option>
						<option value="cm">cm</option>
						<option value="m">m</option>
						<option value="km">km</option>
					</select>
					to
					<select id="final_unit">
						<option value="in">in</option>
						<option value="ft">ft</option>
						<option value="yd">yd</option>
						<option value="mi">mi</option>
						<option value="cm">cm</option>
						<option value="m">m</option>
						<option value="km">km</option>
					</select>
					<button id="convert-btn">Convert</button>
				</form>
				<p id="conversion-result"></p>
				<script type="text/javascript" src="js/metricConverter.js" defer="true"></script>
			</div>
        </div>
    </div>
	<script src="js/task-manager.js"></script>
</body>
</html>
